[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emergentes-rauschen"
version = "0.1.0"
description = "Offene Simulations- und Interpretationsmaschine für emergente Zustandsfelder."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felix" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dashboard = [
    "streamlit>=1.35",
]
fast = [
    "numba>=0.59",
]
all = [
    "streamlit>=1.35",
    "numba>=0.59",
]

[tool.hatch.build.targets.wheel]
packages = ["src/emergent_noise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
